spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# Hikari Connection Pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

app.jwt.secret=${JWT_SECRET:appointley-super-secret-key-appointley-super-secret-key-2026}

app.frontend.base-url=${FRONTEND_DOMAIN}

# Mail Settings
app.email-service.url=${EMAIL_SERVICE_URL:http://localhost:3000}


# Disable Actuator mail health check
management.health.mail.enabled=false